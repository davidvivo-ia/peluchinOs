name: Build & Release

on:
  push:
    branches:
      - claude/retro-os-modern-tech-5GFAP
      - claude/dazzling-fermi-qtPPl
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        default: 'v0.0.1'
        required: true

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri bundles (.deb / .rpm / .AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            imagemagick

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate Tauri icons if missing
        run: |
          if [ ! -f src-tauri/icons/32x32.png ]; then
            mkdir -p src-tauri/icons
            convert -size 1024x1024 xc:'#008080' \
              -gravity center \
              -fill white -font DejaVu-Sans-Bold -pointsize 180 \
              -annotate +0-60 'peluchin' \
              -fill '#00a2e8' -font DejaVu-Sans-Bold -pointsize 180 \
              -annotate +0+120 'Os' \
              -bordercolor '#0a246a' -border 32 \
              src-tauri/icons/base.png
            convert src-tauri/icons/base.png -resize 32x32 src-tauri/icons/32x32.png
            convert src-tauri/icons/base.png -resize 128x128 src-tauri/icons/128x128.png
            convert src-tauri/icons/base.png -resize 256x256 'src-tauri/icons/128x128@2x.png'
            convert src-tauri/icons/base.png -resize 256x256 src-tauri/icons/icon.png
            convert src-tauri/icons/base.png -resize 256x256 \
              \( -clone 0 -resize 16x16 \) \( -clone 0 -resize 32x32 \) \
              \( -clone 0 -resize 48x48 \) \( -clone 0 -resize 64x64 \) \
              \( -clone 0 -resize 128x128 \) \
              src-tauri/icons/icon.ico
            convert src-tauri/icons/base.png -resize 512x512 src-tauri/icons/icon.icns
          fi

      - name: npm install
        run: npm ci

      - name: Build Tauri (release + bundles)
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-iso:
    name: Build Live ISO (bootable Linux + peluchinOs shell)
    runs-on: ubuntu-latest
    needs: build-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install ISO build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            debian-archive-keyring

      - name: Download Tauri bundles
        uses: actions/download-artifact@v4
        with:
          name: tauri-bundles
          path: src-tauri/target/release/bundle/

      - name: Move .deb to expected path
        run: |
          set -e
          ls -la src-tauri/target/release/bundle/deb/
          # build-iso.sh expects exactly the path the Tauri bundler emits

      - name: Build Live ISO
        # SOURCE_DATE_EPOCH set from the commit's author time so SIZES.txt
        # (and downstream artifact hashes) are stable across rebuilds of
        # the same commit — see Reproducible Builds spec.
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          sudo -E scripts/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: peluchinOs-live-iso
          path: iso-build/peluchinOs-live.iso
          if-no-files-found: error

      - name: Install VirtualBox CLI (for OVA generation)
        # We only need VBoxManage — createvm + modifyvm + storageattach +
        # export work without the vboxdrv kernel module (the module is only
        # required to actually RUN a VM, not to package one).  The install
        # may print warnings about being unable to load vboxdrv; ignore.
        run: |
          sudo apt-get install -y --no-install-recommends virtualbox
          VBoxManage --version || true

      - name: Build OVA for VirtualBox
        # Wraps the ISO in a VirtualBox appliance with sensible defaults
        # so the user can double-click → import → run, no settings to
        # touch.  Display=VMSVGA + VT-x/PAE on are the exact settings
        # peluchinOs needs to render quickly.
        run: |
          set -e
          export VBOX_USER_HOME="$RUNNER_TEMP/vboxhome"
          mkdir -p "$VBOX_USER_HOME"
          VM="peluchinOs Live"
          ISO="$PWD/iso-build/peluchinOs-live.iso"
          VBoxManage createvm --name "$VM" --ostype "Debian_64" --register
          VBoxManage modifyvm "$VM" \
            --memory 2048 --cpus 2 \
            --pae on --hwvirtex on \
            --vram 32 --graphicscontroller vmsvga \
            --audio-driver none \
            --boot1 dvd --boot2 disk --boot3 none --boot4 none \
            --description "peluchinOs Live - retro Windows 98-style Linux distro. ISO included; no install needed."
          VBoxManage storagectl "$VM" --name "IDE Controller" --add ide --controller PIIX4
          VBoxManage storageattach "$VM" \
            --storagectl "IDE Controller" --port 0 --device 0 \
            --type dvddrive --medium "$ISO"
          VBoxManage export "$VM" \
            --output iso-build/peluchinOs.ova \
            --options manifest,iso \
            --vsys 0 \
            --vmname "peluchinOs Live"
          ls -lah iso-build/peluchinOs.ova

      - name: Upload OVA
        uses: actions/upload-artifact@v4
        with:
          name: peluchinOs-ova
          path: iso-build/peluchinOs.ova
          if-no-files-found: error

      - name: Install QEMU + helpers (for the boot test)
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 imagemagick netcat-openbsd

      - name: Verify ISO boots to desktop (end-to-end QEMU test)
        # Boots the freshly-built ISO headless under QEMU, captures the
        # framebuffer every 5 s, and fails the build if the kernel does
        # not reach the peluchinos-journal-tty2.service marker within
        # 5 min.  This shifts our confidence from "I tested locally" to
        # "every ISO that ships has been proven to reach userspace".
        # KVM is exposed on GitHub Actions ubuntu-latest runners — use
        # it when available for native speed, fall back to TCG otherwise.
        run: |
          set -e
          mkdir -p /tmp/boot-shots
          rm -f /tmp/serial.log /tmp/qemu.pid /tmp/boot-proof.png

          KVM_FLAG=""
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            KVM_FLAG="-enable-kvm -cpu host"
            echo "✓ /dev/kvm available — booting at native speed"
          else
            echo "⚠ /dev/kvm not available — falling back to TCG (slower)"
          fi

          qemu-system-x86_64 -m 2G -smp 2 -machine pc $KVM_FLAG -no-reboot \
            -cdrom iso-build/peluchinOs-live.iso \
            -display none -vga std \
            -serial file:/tmp/serial.log \
            -monitor unix:/tmp/qmp.sock,server,nowait \
            -daemonize -pidfile /tmp/qemu.pid

          QPID=$(cat /tmp/qemu.pid)
          echo "QEMU pid: $QPID"

          BOOT_OK=0
          # 60 iterations × 5 s = 5 min ceiling
          for i in $(seq 1 60); do
            sleep 5
            T=$((i * 5))

            # snapshot for the timeline
            echo "screendump /tmp/boot-shots/t${T}s.ppm" | \
              nc -U /tmp/qmp.sock -q1 2>/dev/null || true

            # Check whether the boot reached userspace.  The agetty on
            # ttyS0 prints "peluchinos login:" once it's running — that
            # message DOES land on the serial log (the console=tty0
            # last fix means everything ELSE goes to tty0, but agetty
            # writes directly to its own tty, so ttyS0's getty's prompt
            # is still on ttyS0).  Reliable, build-unique marker.
            if grep -q "peluchinos login:" /tmp/serial.log 2>/dev/null; then
              echo "✓ Boot marker found at t+${T}s (userspace reached)"
              BOOT_OK=1
              # Give X another 60 s to actually paint the Tauri window.
              sleep 60
              echo "screendump /tmp/boot-shots/final.ppm" | \
                nc -U /tmp/qmp.sock -q1 2>/dev/null || true
              break
            fi

            if ! kill -0 $QPID 2>/dev/null; then
              echo "✗ QEMU exited prematurely at t+${T}s"
              break
            fi
          done

          kill $QPID 2>/dev/null || true

          # Convert all PPMs to PNGs; pick `final.png` as boot-proof.
          for f in /tmp/boot-shots/*.ppm; do
            [ -f "$f" ] && convert "$f" "${f%.ppm}.png" && rm "$f"
          done
          if [ -f /tmp/boot-shots/final.png ]; then
            cp /tmp/boot-shots/final.png /tmp/boot-proof.png
          else
            LAST=$(ls -1 /tmp/boot-shots/*.png 2>/dev/null | sort -V | tail -1)
            [ -n "$LAST" ] && cp "$LAST" /tmp/boot-proof.png || true
          fi

          if [ -f /tmp/boot-proof.png ]; then
            ls -lah /tmp/boot-proof.png
          fi

          if [ $BOOT_OK -eq 0 ]; then
            echo "::error::Boot test FAILED — kernel did not reach userspace within 5 min"
            echo "=== last 80 lines of serial log ==="
            tail -80 /tmp/serial.log || true
            exit 1
          fi

          echo "✓ Boot test PASSED"

      - name: Upload boot-proof screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peluchinOs-boot-proof
          path: |
            /tmp/boot-proof.png
            /tmp/serial.log
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-tauri, build-iso]
    steps:
      - name: Download Tauri bundles
        uses: actions/download-artifact@v4
        with:
          name: tauri-bundles
          path: assets/

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: peluchinOs-live-iso
          path: assets/

      - name: Download OVA
        uses: actions/download-artifact@v4
        with:
          name: peluchinOs-ova
          path: assets/

      - name: Download boot-proof screenshot
        uses: actions/download-artifact@v4
        with:
          name: peluchinOs-boot-proof
          path: assets/

      - name: Flatten assets + compute checksums
        run: |
          set -e
          cd assets
          find . -type f -name '*.deb' -exec mv {} . \; || true
          find . -type f -name '*.rpm' -exec mv {} . \; || true
          find . -type f -name '*.AppImage' -exec mv {} . \; || true
          find . -mindepth 1 -type d -empty -delete || true
          ls -la
          sha256sum *.deb *.rpm *.AppImage *.iso *.ova > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.1' }}
          target_commitish: ${{ github.sha }}
          name: peluchinOs ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.1' }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## peluchinOs ${{ github.ref_name }}

            A Windows 98/2000-flavoured desktop on a Linux-style boot, built with
            React 19 + Vite 6 + Tauri 2 (Rust), distributed three ways.

            ### 🟢 Bootable Live distribution

            - **`peluchinOs.ova`** — VirtualBox appliance (~640 MB). Double-click
              to import: VM is pre-configured with 2 GB RAM, 2 vCPUs, VMSVGA
              display, VT-x/PAE enabled, ISO attached as DVD. Just press Start
              and pick entry 1.

            - **`peluchinOs-live.iso`** — hybrid BIOS/UEFI ISO, ~640 MB. Boots in
              QEMU/VirtualBox or on bare metal from USB. Latest Linux kernel
              from Debian sid (currently 7.x) + live-boot + autologin + Xorg +
              matchbox kiosk + peluchinOs.

              ```
              qemu-system-x86_64 -m 2G -cdrom peluchinOs-live.iso
              # or to a USB stick:
              sudo dd if=peluchinOs-live.iso of=/dev/sdX bs=4M conv=fsync status=progress
              ```

            ### 🖥️ Native desktop installers (install over your existing OS)

            - **`peluchinOs_*.deb`** — Debian/Ubuntu installer (~1.6 MB)
            - **`peluchinOs*.rpm`** — RedHat/Fedora installer (~1.6 MB)
            - **`peluchinOs_*.AppImage`** — universal Linux, GTK bundled (~73 MB)

            ### Integrity

            See `SHA256SUMS` for checksums of every asset.

            **Boot proof**: every release embeds `boot-proof.png` — a
            framebuffer screenshot taken during a CI-run QEMU boot test.
            If the screenshot shows the peluchinOs desktop, the .iso/.ova
            in this release has been independently verified to reach
            userspace before publication.

            ### Apps included

            File Explorer · Terminal MS-DOS (~50 commands, pipes, redirects) ·
            Notepad · Paint (8 tools) · Minesweeper · Solitaire · Event Viewer
            (live kernel log). Boot screen runs real probes (logger, wm, vfs,
            web crypto, IndexedDB…). Ctrl+Alt+Del for BSOD easter egg.
          files: |
            assets/*.deb
            assets/*.rpm
            assets/*.AppImage
            assets/*.iso
            assets/*.ova
            assets/*.png
            assets/SHA256SUMS
