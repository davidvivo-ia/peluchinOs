[package]
name = "peluchinos"
version = "0.0.1"
description = "peluchinOs — a Windows 98/2000 desktop with a Linux-style boot"
authors = ["peluchinOs contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "peluchinos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
